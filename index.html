<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мини-приложение с 4 кнопками</title>
    <style>
        :root {
            --primary-color: #0088cc; /* Фирменный цвет Telegram */
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e0e0e0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        header {
            background: var(--primary-color);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }
        .nav-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            padding: 15px;
            background: #f8fafc;
            border-bottom: 1px solid var(--border-color);
        }
        .nav-btn {
            background: white;
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }
        .nav-btn:hover, .nav-btn.active {
            background: var(--primary-color);
            color: white;
        }
        .content-section {
            padding: 20px;
            display: none;
            flex-direction: column;
            gap: 15px;
        }
        .content-section.active {
            display: flex;
        }
        /* Стили калькулятора */
        .calculator {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        .calc-display {
            grid-column: span 4;
            background: #eee;
            padding: 15px;
            font-size: 24px;
            text-align: right;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            word-break: break-all;
        }
        .calc-btn {
            padding: 15px;
            font-size: 18px;
            background: #f0f2f5;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .calc-btn:hover { background: #e4e6eb; }
        .calc-btn.operator { background: #e1f0fa; color: var(--primary-color); }
        .calc-btn.equals { background: var(--primary-color); color: white; grid-column: span 2; }
        
        /* Элементы управления */
        input[type="text"] {
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: var(--primary-color);
        }
        .action-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .action-btn:hover {
            opacity: 0.9;
        }
        .info-box {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 8px;
            font-size: 15px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">
    <header>Telegram Web App</header>
    
    <!-- 4 Главные кнопки управления -->
    <div class="nav-buttons">
        <button class="nav-btn active" onclick="switchTab('weather', this)">🌤 Погода</button>
        <button class="nav-btn" onclick="switchTab('currency', this)">💱 Курс валют</button>
        <button class="nav-btn" onclick="switchTab('calculator', this)">🧮 Калькулятор</button>
        <button class="nav-btn" onclick="switchTab('search', this)">🔍 Поиск в Telegram</button>
    </div>

    <!-- 1. Секция: Погода -->
    <div id="weather" class="content-section active">
        <h3>Реальная погода</h3>
        <button class="action-btn" onclick="getWeather()">Обновить погоду</button>
        <div id="weather-result" class="info-box">Нажмите кнопку для загрузки текущей погоды...</div>
    </div>

    <!-- 2. Секция: Курс валют -->
    <div id="currency" class="content-section">
        <h3>Курсы валют (USD)</h3>
        <button class="action-btn" onclick="getCurrency()">Загрузить курсы</button>
        <div id="currency-result" class="info-box">Нажмите кнопку для получения актуальных курсов...</div>
    </div>

    <!-- 3. Секция: Калькулятор -->
    <div id="calculator" class="content-section">
        <h3>Калькулятор</h3>
        <div class="calculator">
            <div id="calc-screen" class="calc-display">0</div>
            <button class="calc-btn" onclick="clearCalc()">C</button>
            <button class="calc-btn operator" onclick="appendCalc('/')">/</button>
            <button class="calc-btn operator" onclick="appendCalc('*')">*</button>
            <button class="calc-btn operator" onclick="appendCalc('-')">-</button>
            
            <button class="calc-btn" onclick="appendCalc('7')">7</button>
            <button class="calc-btn" onclick="appendCalc('8')">8</button>
            <button class="calc-btn" onclick="appendCalc('9')">9</button>
            <button class="calc-btn operator" onclick="appendCalc('+')">+</button>
            
            <button class="calc-btn" onclick="appendCalc('4')">4</button>
            <button class="calc-btn" onclick="appendCalc('5')">5</button>
            <button class="calc-btn" onclick="appendCalc('6')">6</button>
            <button class="calc-btn equals" onclick="calculate()">=</button>
            
            <button class="calc-btn" onclick="appendCalc('1')">1</button>
            <button class="calc-btn" onclick="appendCalc('2')">2</button>
            <button class="calc-btn" onclick="appendCalc('3')">3</button>
            <button class="calc-btn" onclick="appendCalc('0')" style="grid-column: span 2;">0</button>
            <button class="calc-btn" onclick="appendCalc('.')">.</button>
        </div>
    </div>

    <!-- 4. Секция: Поиск строго в Telegram -->
    <div id="search" class="content-section">
        <h3>Поиск в Telegram</h3>
        <p style="font-size: 13px; color: #666; margin: 0;">Ищет информацию исключительно по публичным материалам и каналам Telegram.</p>
        <input type="text" id="tg-search-input" placeholder="Что найти в Telegram?">
        <button class="action-btn" onclick="searchTelegram()">Найти</button>
    </div>
</div>

<script>
    // Переключение вкладок
    function switchTab(tabId, btn) {
        document.querySelectorAll('.content-section').forEach(sec => sec.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        
        document.getElementById(tabId).classList.add('active');
        btn.classList.add('active');
    }

    // 1. Погода (использует Open-Meteo API без ключей и геолокацию пользователя)
    function getWeather() {
        const resBox = document.getElementById('weather-result');
        resBox.innerHTML = "Определение координат и загрузка погоды...";
        
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                position => fetchWeatherCoords(position.coords.latitude, position.coords.longitude),
                () => fetchWeatherCoords(50.4501, 30.5234) // Резервные координаты (Киев)
            );
        } else {
            fetchWeatherCoords(50.4501, 30.5234);
        }
    }

    function fetchWeatherCoords(lat, lon) {
        fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`)
            .then(res => res.json())
            .then(data => {
                const w = data.current_weather;
                document.getElementById('weather-result').innerHTML = `
                    <strong>Широта/Долгота:</strong> ${lat.toFixed(2)}, ${lon.toFixed(2)}<br>
                    <strong>Температура:</strong> ${w.temperature} °C<br>
                    <strong>Скорость ветра:</strong> ${w.windspeed} км/ч<br>
                    <strong>Статус:</strong> Успешно загружено
                `;
            })
            .catch(() => {
                document.getElementById('weather-result').innerHTML = "Не удалось загрузить данные о погоде.";
            });
    }

    // 2. Курс валют (использует Frankfurter API)
    function getCurrency() {
        const resBox = document.getElementById('currency-result');
        resBox.innerHTML = "Загрузка курсов валют...";
        
        fetch('https://api.frankfurter.app/latest?from=USD&to=EUR,UAH')
            .then(res => res.json())
            .then(data => {
                resBox.innerHTML = `
                    <strong>Базовая валюта:</strong> 1 USD<br>
                    <strong>Евро (EUR):</strong> ${data.rates.EUR}<br>
                    <strong>Гривна (UAH):</strong> ${data.rates.UAH}<br>
                    <small>Актуально на: ${data.date}</small>
                `;
            })
            .catch(() => {
                resBox.innerHTML = "Не удалось загрузить курсы валют.";
            });
    }

    // 3. Логика калькулятора
    let calcScreen = document.getElementById('calc-screen');
    let currentInput = "0";

    function appendCalc(val) {
        if (currentInput === "0" && val !== '.') {
            currentInput = val;
        } else {
            currentInput += val;
        }
        calcScreen.innerText = currentInput;
    }

    function clearCalc() {
        currentInput = "0";
        calcScreen.innerText = currentInput;
    }

    function calculate() {
        try {
            let result = eval(currentInput.replace(/[^0-9+\-*/.]/g, ''));
            currentInput = String(result);
            calcScreen.innerText = currentInput;
        } catch {
            calcScreen.innerText = "Ошибка";
            currentInput = "0";
        }
    }

    // 4. Поиск строго в Telegram с помощью оператора site:t.me
    function searchTelegram() {
        const query = document.getElementById('tg-search-input').value.trim();
        if (!query) {
            alert("Пожалуйста, введите поисковый запрос!");
            return;
        }
        const searchUrl = `https://www.google.com/search?q=site:t.me+${encodeURIComponent(query)}`;
        window.open(searchUrl, '_blank');
    }
</script>

</body>
</html>
