<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super App Hub</title>
    <style>
        :root {
            --tg-theme-bg-color: #fefefe;
            --tg-theme-text-color: #222222;
            --tg-theme-hint-color: #8e8e93;
            --tg-theme-link-color: #007aff;
            --tg-theme-button-color: #007aff;
            --tg-theme-button-text-color: #ffffff;
            --card-bg: #ffffff;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            --radius: 20px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --tg-theme-bg-color: #0f0f11;
                --tg-theme-text-color: #f5f5f7;
                --tg-theme-hint-color: #98989f;
                --card-bg: #1c1c1e;
                --shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        /* Шапка */
        .app-header {
            padding: 24px 20px 16px;
            text-align: center;
        }

        .app-header h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .app-header p {
            font-size: 13px;
            color: var(--tg-theme-hint-color);
            margin-top: 4px;
        }

        /* Контент секций */
        .content-area {
            padding: 0 20px 20px;
            min-height: 320px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .section {
            display: none;
            flex-direction: column;
            gap: 16px;
            animation: fadeIn 0.3s ease-in-out;
        }

        .section.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Карточки информации */
        .glass-card {
            background: rgba(120, 120, 128, 0.06);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
        }

        .stat-row span:first-child {
            color: var(--tg-theme-hint-color);
        }

        .stat-row span:last-child {
            font-weight: 600;
        }

        /* Кнопки действий */
        .btn-primary {
            background-color: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
            border: none;
            border-radius: 14px;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            text-align: center;
        }

        .btn-primary:active {
            transform: scale(0.98);
            opacity: 0.85;
        }

        /* Поле ввода */
        .input-group {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        input[type="text"] {
            width: 100%;
            background: rgba(120, 120, 128, 0.08);
            border: 1px solid transparent;
            border-radius: 14px;
            padding: 14px 16px;
            font-size: 16px;
            color: var(--tg-theme-text-color);
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--tg-theme-button-color);
        }

        /* Калькулятор */
        .calc-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .calc-display {
            grid-column: span 4;
            background: rgba(120, 120, 128, 0.08);
            padding: 18px;
            font-size: 28px;
            font-weight: 600;
            text-align: right;
            border-radius: 14px;
            letter-spacing: 1px;
            word-break: break-all;
        }

        .calc-btn {
            background: rgba(120, 120, 128, 0.08);
            border: none;
            border-radius: 12px;
            padding: 16px 0;
            font-size: 18px;
            font-weight: 600;
            color: var(--tg-theme-text-color);
            cursor: pointer;
            transition: background 0.15s;
        }

        .calc-btn:active {
            background: rgba(120, 120, 128, 0.2);
        }

        .calc-btn.op {
            color: var(--tg-theme-button-color);
            background: rgba(0, 122, 255, 0.1);
        }

        .calc-btn.eq {
            background: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
            grid-column: span 2;
        }

        /* Нижнее меню (TabBar) */
        .tab-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            background: rgba(120, 120, 128, 0.04);
            border-top: 1px solid rgba(120, 120, 128, 0.1);
            padding: 8px;
            gap: 4px;
        }

        .tab-item {
            background: transparent;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 0;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            color: var(--tg-theme-hint-color);
        }

        .tab-item svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .tab-item span {
            font-size: 11px;
            font-weight: 500;
        }

        .tab-item.active {
            background: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="app-header">
        <h1 id="header-title">Погода</h1>
        <p id="header-subtitle">Актуальные данные в реальном времени</p>
    </div>

    <div class="content-area">
        <!-- 1. Погода -->
        <div id="section-weather" class="section active">
            <div class="glass-card">
                <div class="stat-row"><span>Статус</span><span id="w-status">Ожидание запроса</span></div>
                <div class="stat-row"><span>Температура</span><span id="w-temp">—</span></div>
                <div class="stat-row"><span>Ветер</span><span id="w-wind">—</span></div>
            </div>
            <button class="btn-primary" onclick="getWeather()">Узнать погоду</button>
        </div>

        <!-- 2. Курс валют -->
        <div id="section-currency" class="section">
            <div class="glass-card">
                <div class="stat-row"><span>База</span><span>1 USD</span></div>
                <div class="stat-row"><span>Евро (EUR)</span><span id="c-eur">—</span></div>
                <div class="stat-row"><span>Гривна (UAH)</span><span id="c-uah">—</span></div>
            </div>
            <button class="btn-primary" onclick="getCurrency()">Обновить курсы</button>
        </div>

        <!-- 3. Калькулятор -->
        <div id="section-calc" class="section">
            <div class="calc-grid">
                <div id="calc-screen" class="calc-display">0</div>
                <button class="calc-btn" onclick="clearCalc()">C</button>
                <button class="calc-btn op" onclick="appendCalc('/')">/</button>
                <button class="calc-btn op" onclick="appendCalc('*')">*</button>
                <button class="calc-btn op" onclick="appendCalc('-')">-</button>
                
                <button class="calc-btn" onclick="appendCalc('7')">7</button>
                <button class="calc-btn" onclick="appendCalc('8')">8</button>
                <button class="calc-btn" onclick="appendCalc('9')">9</button>
                <button class="calc-btn op" onclick="appendCalc('+')">+</button>
                
                <button class="calc-btn" onclick="appendCalc('4')">4</button>
                <button class="calc-btn" onclick="appendCalc('5')">5</button>
                <button class="calc-btn" onclick="appendCalc('6')">6</button>
                <button class="calc-btn eq" onclick="calculate()">=</button>
                
                <button class="calc-btn" onclick="appendCalc('1')">1</button>
                <button class="calc-btn" onclick="appendCalc('2')">2</button>
                <button class="calc-btn" onclick="appendCalc('3')">3</button>
                <button class="calc-btn" onclick="appendCalc('0')" style="grid-column: span 2;">0</button>
                <button class="calc-btn" onclick="appendCalc('.')">.</button>
            </div>
        </div>

        <!-- 4. Поиск в Telegram -->
        <div id="section-search" class="section">
            <div class="input-group">
                <p style="font-size: 13px; color: var(--tg-theme-hint-color);">Индексация каналов и постов через Google (site:t.me)</p>
                <input type="text" id="tg-query" placeholder="Введите ключевые слова...">
            </div>
            <button class="btn-primary" onclick="searchTelegram()">Искать в Telegram</button>
        </div>
    </div>

    <!-- Навигация (Нижний TabBar) -->
    <div class="tab-bar">
        <button class="tab-item active" onclick="switchTab('weather', 'Погода', 'Актуальные данные в реальном времени', this)">
            <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0-9 9 9 9 0 0 0 9 9 9 9 0 0 0 9-9 9 9 0 0 0-9-9m0 2c3.87 0 7 3.13 7 7a6.99 6.99 0 0 1-5.11 6.74l-.57-.88A5.002 5.002 0 0 0 14 12c0-1.22-.45-2.33-1.19-3.19l.73-.73c-.5-.39-1.07-.69-1.7-1.01l-.22.84C11.39 7.42 11 7 10.5 7c-.55 0-1 .45-1 1 0 .28.11.53.29.71l-.71.71C8.33 9.77 8 10.84 8 12c0 2.21 1.79 4 4 4s4-1.79 4-4c0-1.16-.47-2.22-1.23-2.99l-.71.71c.18.18.29.43.29.71 0 .55-.45 1-1 1s-1-.45-1-1c0-.52-.14-1.01-.39-1.43l-.22-.38z"/></svg>
            <span>Погода</span>
        </button>
        <button class="tab-item" onclick="switchTab('currency', 'Курс валют', 'Котировки по отношению к USD', this)">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 16h-2v-1.18c-1.16-.23-2.1-1.01-2.43-2.07l1.85-.75c.21.66.85 1.13 1.58 1.13.97 0 1.75-.78 1.75-1.75 0-.85-.6-1.57-1.41-1.72l-1.54-.31C9.69 11.02 9 9.94 9 8.75 9 7.24 10.24 6 11.75 6V5h2v1.18c1.07.24 1.9 1.04 2.21 2.03l-1.83.77c-.19-.58-.75-1-1.38-1-.83 0-1.5.67-1.5 1.5 0 .73.52 1.34 1.23 1.48l1.55.32c1.4.29 2.22 1.43 2.22 2.7 0 1.51-1.24 2.75-2.75 2.75z"/></svg>
            <span>Валюты</span>
        </button>
        <button class="tab-item" onclick="switchTab('calc', 'Калькулятор', 'Быстрые расчеты', this)">
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
            <span>Калькулятор</span>
        </button>
        <button class="tab-item" onclick="switchTab('search', 'Telegram Поиск', 'Фильтрация по базе site:t.me', this)">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <span>Поиск</span>
        </button>
    </div>
</div>

<script>
    // Переключение вкладок с плавной сменой заголовков
    function switchTab(tabName, title, subtitle, btnElement) {
        document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
        document.querySelectorAll('.tab-item').forEach(item => item.classList.remove('active'));
        
        document.getElementById('section-' + tabName).classList.add('active');
        btnElement.classList.add('active');
        
        document.getElementById('header-title').innerText = title;
        document.getElementById('header-subtitle').innerText = subtitle;
    }

    // Погода (Open-Meteo)
    function getWeather() {
        document.getElementById('w-status').innerText = "Определение координат...";
        const success = (pos) => fetchWeatherCoords(pos.coords.latitude, pos.coords.longitude);
        const error = () => fetchWeatherCoords(50.4501, 30.5234); // Резерв
        
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(success, error, { timeout: 5000 });
        } else {
            error();
        }
    }

    function fetchWeatherCoords(lat, lon) {
        fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`)
            .then(res => res.json())
            .then(data => {
                const w = data.current_weather;
                document.getElementById('w-status').innerText = "Успешно";
                document.getElementById('w-temp').innerText = `${w.temperature} °C`;
                document.getElementById('w-wind').innerText = `${w.windspeed} км/ч`;
            })
            .catch(() => {
                document.getElementById('w-status').innerText = "Ошибка загрузки";
            });
    }

    // Курс валют
    function getCurrency() {
        document.getElementById('c-eur').innerText = "Загрузка...";
        document.getElementById('c-uah').innerText = "Загрузка...";
        
        fetch('https://api.frankfurter.app/latest?from=USD&to=EUR,UAH')
            .then(res => res.json())
            .then(data => {
                document.getElementById('c-eur').innerText = data.rates.EUR;
                document.getElementById('c-uah').innerText = data.rates.UAH;
            })
            .catch(() => {
                document.getElementById('c-eur').innerText = "Ошибка";
                document.getElementById('c-uah').innerText = "Ошибка";
            });
    }

    // Калькулятор
    let screen = document.getElementById('calc-screen');
    let expr = "0";

    function appendCalc(val) {
        if (expr === "0" && val !== '.') {
            expr = val;
        } else {
            expr += val;
        }
        screen.innerText = expr;
    }

    function clearCalc() {
        expr = "0";
        screen.innerText = expr;
    }

    function calculate() {
        try {
            let res = eval(expr.replace(/[^0-9+\-*/.]/g, ''));
            expr = String(res);
            screen.innerText = expr;
        } catch {
            screen.innerText = "Ошибка";
            expr = "0";
        }
    }

    // Поиск строго по Telegram
    function searchTelegram() {
        const q = document.getElementById('tg-query').value.trim();
        if (!q) {
            alert("Введите запрос для поиска!");
            return;
        }
        window.open(`https://www.google.com/search?q=site:t.me+${encodeURIComponent(q)}`, '_blank');
    }
</script>

</body>
</html>
